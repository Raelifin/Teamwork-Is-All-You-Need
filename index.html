<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teamwork Is All You Need</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #07090a; --panel: #0d1311; --panel-2: #121b18; --line: #1e2d27; --line-2: #2b4239;
    --fg: #d3f2e1; --muted: #6f8a7e; --green: #3dff9a; --green-dim: #1d7a4d;
    --red: #ff4d5e; --red-dark: #d93545; --magenta: #ff4fd8;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Consolas, monospace;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 14px/1.6 var(--mono); background: var(--bg); color: var(--fg);
         background-image: radial-gradient(ellipse at top, #0f1a15 0%, var(--bg) 60%); min-height: 100vh; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.4; box-shadow: none !important; }
  ::selection { background: var(--green-dim); color: #fff; }

  /* ---- Top bar ---- */
  #top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 15px; font-weight: 700; margin: 0; color: var(--green); letter-spacing: 0.04em; text-shadow: 0 0 10px rgba(61, 255, 154, 0.35); }
  h1::before { content: "> "; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }

  #end { border: 1px solid #ff6b78; border-radius: var(--radius); background: #b0172b; color: #fff; padding: 7px 16px;
         display: flex; flex-direction: column; align-items: center; line-height: 1.25;
         box-shadow: 0 0 0 1px rgba(255, 77, 94, 0.3), 0 0 16px rgba(255, 77, 94, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
         transition: background 0.15s, box-shadow 0.15s, transform 0.05s; }
  #end:hover:not(:disabled) { background: #951223; box-shadow: 0 0 0 1px rgba(255, 77, 94, 0.5), 0 0 24px rgba(255, 77, 94, 0.55); }
  #end:active:not(:disabled) { transform: translateY(1px); }
  #end .main { font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; }
  #end small { font-size: 10.5px; color: #ffd9dd; }

  /* ---- Score ---- */
  #score { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
           padding: 10px 12px 12px; margin-bottom: 18px; }
  .score-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 8px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .stat { flex: 1 1 130px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 8px; min-width: 0; }
  .stat.primary { flex: 1.7 1 200px; }
  .stat-head { display: flex; align-items: center; gap: 6px; }
  .stat .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: auto; }
  .stat .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg); margin-top: 2px; }
  .stat.primary { border-color: var(--green-dim); box-shadow: inset 0 0 20px rgba(61, 255, 154, 0.06); }
  .stat.primary .label { color: var(--green); }
  .stat.primary .value { font-size: 40px; line-height: 1.1; color: var(--green); text-shadow: 0 0 14px rgba(61, 255, 154, 0.4); }
  .restore { display: none; }
  .stat.min { flex: 0 0 auto; padding: 0; border: 0; background: none; box-shadow: none; }
  .stat.min > :not(.restore) { display: none; }
  .stat.min .restore { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%;
                       min-height: 40px; padding: 4px 8px; border-radius: 6px; border: 1px dashed var(--line-2); background: var(--panel);
                       color: var(--muted); font-size: 9.5px; letter-spacing: 0.06em; }
  .stat.min .restore svg { color: var(--green); }
  .stat.min .restore:hover { border-color: var(--green); color: var(--fg); background: rgba(61, 255, 154, 0.08); }

  .icon-btn { flex: none; width: 22px; height: 22px; padding: 0; display: grid; place-items: center; border-radius: 5px;
              border: 1px solid var(--line-2); background: var(--panel); color: var(--green); font-size: 11px; font-weight: 700; line-height: 1; }
  .icon-btn:hover, .icon-btn[aria-expanded="true"].info { border-color: var(--green); background: rgba(61, 255, 154, 0.1); }
  .tip-anchor { position: relative; flex: none; }
  .tip { position: absolute; top: calc(100% + 8px); left: 0; z-index: 10; display: none; width: max-content; max-width: min(280px, calc(100vw - 16px));
         background: #0a1310; border: 1px solid var(--green-dim); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; line-height: 1.5;
         color: var(--fg); text-transform: none; letter-spacing: normal; white-space: normal; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); }
  .tip::before { content: ""; position: absolute; top: -5px; left: calc(var(--arrow-x, 12px) - 4px); width: 8px; height: 8px;
                 background: #0a1310; border-left: 1px solid var(--green-dim); border-top: 1px solid var(--green-dim); transform: rotate(45deg); }
  .tip.show { display: block; }
  .tip b { color: var(--green); }

  /* ---- Main layout ---- */
  main { display: grid; grid-template-columns: minmax(0, 620px) minmax(300px, 1fr); gap: 22px; align-items: start; }
  #side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  #views { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  figure { margin: 0; min-width: 0; }
  figcaption { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px;
           border: 1px solid var(--line-2); box-shadow: 0 0 0 1px #000, 0 0 18px rgba(61, 255, 154, 0.08); }

  #instructions { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.55; color: #bfe0cf; }
  #instructions p { margin: 0 0 0.8em; }
  #instructions p:last-child { margin-bottom: 0; }
  #instructions strong { color: var(--fg); font-weight: 700; }

  #composer { display: flex; gap: 8px; }
  .prompt { flex: 1; min-width: 0; display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--radius);
            background: var(--panel); padding-left: 10px; }
  .prompt::before { content: ">"; color: var(--green); font-weight: 700; }
  .prompt:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px rgba(61, 255, 154, 0.15); }
  #msg { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 10px 10px 8px; border: 0; outline: 0;
         background: transparent; color: var(--fg); caret-color: var(--green); }
  #msg::placeholder { color: #4d6359; }
  #send { border: 1px solid #8dffc4; border-radius: var(--radius); background: var(--green); color: #03150b; padding: 0 20px;
          font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
          box-shadow: 0 0 0 1px rgba(61, 255, 154, 0.3), 0 0 16px rgba(61, 255, 154, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
          transition: box-shadow 0.15s, transform 0.05s, filter 0.15s; }
  #send:hover:not(:disabled) { filter: brightness(1.08); box-shadow: 0 0 0 1px rgba(61, 255, 154, 0.5), 0 0 26px rgba(61, 255, 154, 0.55); }
  #send:active:not(:disabled) { transform: translateY(1px); }
  #composer-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; margin-top: -8px; }
  #status.busy { color: var(--green); }
  #status.busy::after { content: "▍"; animation: blink 0.8s steps(1) infinite; }
  #status.error { color: var(--red); }
  #count { flex: none; }
  #count.near { color: var(--red); }

  /* ---- Debug panel ---- */
  #debug { margin-top: 32px; padding: 12px 14px; border: 1px dashed #3a5a70; border-radius: var(--radius); background: #0a1016; }
  #debug h2 { font-size: 13px; margin: 0 0 2px; color: #7fc4ff; text-transform: uppercase; letter-spacing: 0.1em; }
  #debug .note { margin: 0 0 10px; font-size: 12px; color: #6d8aa0; }
  #debug details { margin-bottom: 8px; }
  #debug summary { cursor: pointer; font-weight: 600; font-size: 12px; color: #9ccfff; }
  #debug pre, .dbg { font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: #c6d6e4;
                     background: #0e1620; border: 1px solid #1d2c3a; border-radius: 6px; padding: 6px 8px; margin: 4px 0; }
  .dbg .role { display: block; font-weight: 700; font-size: 10.5px; letter-spacing: 0.08em; margin-bottom: 2px; }
  .dbg.user .role { color: var(--green); }
  .dbg.assistant .role { color: var(--magenta); }
  .dbg.tool_use { border-color: #3d2140; }
  .dbg.note-line { color: #8fa3b5; font-style: italic; }

  /* ---- Narrow screens ---- */
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); }
    #side { display: contents; }
    #instructions { order: 1; }
    #board { order: 2; max-width: 560px; }
    #composer { order: 3; }
    #composer-meta { order: 4; margin-top: -14px; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 12px 16px; }
    .stat { flex-basis: calc(50% - 4px); }
    .stat.primary:not(.min) { flex-basis: 100%; }
    .stat.primary .value { font-size: 34px; }
    #send { padding: 0 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <h1>Teamwork Is All You Need</h1>
    <button id="end"><span class="main">End Game</span><small>&amp; submit score</small></button>
  </header>

  <section id="score">
    <div class="score-head">Score dimensions (lower is better)</div>
    <div class="stats" id="stats"></div>
  </section>

  <main>
    <section id="board">
      <div id="views">
        <figure><figcaption>Live view:</figcaption><canvas id="live"></canvas></figure>
        <figure><figcaption>Target:</figcaption><canvas id="target"></canvas></figure>
      </div>
    </section>

    <section id="side">
      <div id="instructions"></div>
      <div id="composer">
        <label class="prompt"><input id="msg" type="text" maxlength="600" autocomplete="off" placeholder="Instructions for the robot" aria-label="Instructions for the robot"></label>
        <button id="send">Send</button>
      </div>
      <div id="composer-meta"><span id="status"></span><span id="count">0 / 600</span></div>
    </section>
  </main>

  <section id="debug" hidden>
    <h2>Debug: the agent's view</h2>
    <p class="note" id="debug-note"></p>
    <details open><summary>System prompt</summary><pre id="dbg-system"></pre></details>
    <details><summary id="dbg-tools-summary">Tools</summary><pre id="dbg-tools"></pre></details>
    <div id="dbg-msgs"></div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
